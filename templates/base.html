<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}StudyTrack{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tasks.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
</head>

<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a class="site-logo" href="{{ url_for('index') }}">
                StudyTrack
            </a>

            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Dashboard</a></li>
                <li><a href="{{ url_for('subjects') }}">Subjects</a></li>
                <li><a href="{{ url_for('tasks') }}">Tasks</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <section class="messages" aria-label="Notifications">
            {% for category, message in messages %}
            <p class="message message-{{ category }}">
                {{ message }}
            </p>
            {% endfor %}
        </section>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 StudyTrack</p>
    </footer>
</body>

</html>
