{% extends "base.html" %}

{% block title %}Edit {{ subject.name }} | StudyTrack{% endblock %}

{% block content %}
<section>
    <h1>Edit subject</h1>

    <p>
        Update the details for {{ subject.name }}.
    </p>
</section>

<section>
    <form method="POST" action="{{ url_for('edit_subject', subject_id=subject.id) }}">
        <div>
            <label for="name">Subject name</label>
            <input type="text" id="name" name="name" maxlength="100"
                value="{{ request.form.get('name', subject.name) }}" required>
        </div>

        <div>
            <label for="description">Description</label>
            <textarea id="description" name="description"
                rows="5">{{ request.form.get('description', subject.description or '') }}</textarea>
        </div>

        <div>
            <label for="colour">Colour</label>
            {% set selected_colour = request.form.get('colour', subject.colour) %}
            <select id="colour" name="colour" required>
                <option value="blue" {% if selected_colour=='blue' %}selected{% endif %}>
                    Blue
                </option>
                <option value="green" {% if selected_colour=='green' %}selected{% endif %}>
                    Green
                </option>
                <option value="purple" {% if selected_colour=='purple' %}selected{% endif %}>
                    Purple
                </option>
                <option value="orange" {% if selected_colour=='orange' %}selected{% endif %}>
                    Orange
                </option>
                <option value="red" {% if selected_colour=='red' %}selected{% endif %}>
                    Red
                </option>
            </select>
        </div>

        <button type="submit">Save changes</button>
        <a href="{{ url_for('subject_detail', subject_id=subject.id) }}">
            Cancel
        </a>
    </form>
</section>
{% endblock %}
