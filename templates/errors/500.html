{% extends "base.html" %}

{% block title %}Server Error | StudyTrack{% endblock %}

{% block content %}
<section>
    <h1>Something went wrong</h1>

    <p>
        StudyTrack could not complete your request because of an unexpected
        server error.
    </p>

    <p>
        Please return to the Dashboard and try again.
    </p>

    <a href="{{ url_for('index') }}">Return to the Dashboard</a>
</section>
{% endblock %}
